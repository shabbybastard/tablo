name: OTA release and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "src/**"
      - "include/**"
      - "cmake/**"
      - "scripts/**"
      - "platformio.ini"
      - "partitions.csv"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 1.2.3, got '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version is not already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          tag="v$VERSION"
          # `--tags` prints peeled `^{}` entries for annotated tags; a pattern
          # would return only the tag object without them.
          refs="$(git ls-remote --tags origin)"
          target="$(printf '%s\n' "$refs" | awk \
            -v plain="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" '
              $2 == plain { fallback = $1 }
              $2 == peeled { commit = $1 }
              END { print (commit ? commit : fallback) }')"
          if [[ -z "$target" ]]; then
            echo "Tag $tag does not exist yet."
            exit 0
          fi
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "error: tag $tag already points at commit $target." >&2
            echo "Bump VERSION before publishing firmware from another commit." >&2
            exit 1
          fi
          echo "Tag $tag belongs to this commit; republishing."

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade 'platformio==6.2.0'

      - name: Build firmware
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e esp32s3

      - name: Prepare Pages artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp .pio/build/esp32s3/firmware.bin dist/firmware.bin
          python3 scripts/make_manifest.py "$VERSION" dist/firmware.bin dist/manifest.json
          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>tablo firmware</title>
          <style>
            body{margin:0;background:#0b0f14;color:#e7edf5;font:16px/1.6 ui-monospace,monospace;
                 display:flex;min-height:100vh;align-items:center;justify-content:center}
            main{width:min(560px,90vw);border:1px solid #24313d;border-radius:16px;padding:28px;
                 background:#111820}
            h1{margin:0 0 6px;font-size:24px}p{color:#91a0b0}
            a{color:#4fc3f7}code{color:#b9e6ff}
          </style></head><body><main>
          <h1>tablo</h1>
          <p>Автономный дисплей Guition ESP32-4848S040.</p>
          <p>Версия: <code>${VERSION}</code></p>
          <p><a href="firmware.bin">firmware.bin</a> · <a href="manifest.json">manifest.json</a></p>
          <p><a href="https://github.com/shabbybastard/tablo/releases">Релизы на GitHub</a></p>
          <p>Этот адрес используется устройством для OTA-проверки.</p>
          </main></body></html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: ota-dist
          path: dist
          retention-days: 1

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ota-dist
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/release_notes.py "$VERSION" CHANGELOG.md > release-notes.md
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/firmware.bin dist/manifest.json --clobber
          else
            gh release create "$tag" dist/firmware.bin dist/manifest.json \
              --target "$GITHUB_SHA" --title "tablo $VERSION" --notes-file release-notes.md
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
