name: OTA build and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade 'platformio==6.2.0'

      - name: Build firmware
        env:
          FW_VERSION: 1.0.${{ github.run_number }}
        run: pio run -e esp32s3

      - name: Prepare Pages artifact
        env:
          FW_VERSION: 1.0.${{ github.run_number }}
        run: |
          mkdir -p dist
          cp .pio/build/esp32s3/firmware.bin dist/firmware.bin
          python3 scripts/make_manifest.py "$FW_VERSION" dist/firmware.bin dist/manifest.json
          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>tablo firmware</title>
          <style>
            body{margin:0;background:#0b0f14;color:#e7edf5;font:16px/1.6 ui-monospace,monospace;
                 display:flex;min-height:100vh;align-items:center;justify-content:center}
            main{width:min(560px,90vw);border:1px solid #24313d;border-radius:16px;padding:28px;
                 background:#111820}
            h1{margin:0 0 6px;font-size:24px}p{color:#91a0b0}
            a{color:#4fc3f7}code{color:#b9e6ff}
          </style></head><body><main>
          <h1>tablo</h1>
          <p>Автономный дисплей Guition ESP32-4848S040.</p>
          <p>Версия: <code>${FW_VERSION}</code></p>
          <p><a href="firmware.bin">firmware.bin</a> · <a href="manifest.json">manifest.json</a></p>
          <p>Этот адрес используется устройством для OTA-проверки.</p>
          </main></body></html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
