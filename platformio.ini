; tablo — Guition ESP32-4848S040 (ESP32-S3-WROOM-1-N16R8)
; Firmware build: pio run -e esp32s3

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

; 16 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

; WASM HAL must never be linked into the firmware.
build_src_filter = +<*> -<hal_wasm/>

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/include
  -DTABLO_ESP32=1
  -Wall
  -Wextra
  -Wl,-z,noexecstack

lib_deps =
  lvgl/lvgl@9.3.0
  moononournation/GFX Library for Arduino@1.6.9

extra_scripts = pre:scripts/pio_build_info.py
